[build]
builder = "RAILPACK"

[deploy]
startCommand = "bash -lc 'export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1; mkdir -p /app/persist; ( rm -rf external/UDED external/UDED-main && mkdir -p external && /app/.venv/bin/python -c \"import io,zipfile,requests,pathlib,shutil; p=pathlib.Path(\\\"external\\\"); z=zipfile.ZipFile(io.BytesIO(requests.get(\\\"https://github.com/xavysp/UDED/archive/refs/heads/main.zip\\\",timeout=120).content)); z.extractall(p); shutil.move(str(p/\\\"UDED-main\\\"),str(p/\\\"UDED\\\"))\" && /app/.venv/bin/python synthetic_v2.py && /app/.venv/bin/python prepare_stage5_models_light.py --out /app/persist/stage5_measures --skip-full-capacity && /app/.venv/bin/python benchmark_uded_stage7_resilient.py --uded-root external/UDED --model-dir /app/persist/stage5_measures --out /app/persist/stage7 --max-side 256 --thresholds 21 --bootstrap 5000 --workers 1 --preview 6 --parallel-benchmark-images 2 && echo UDED_STAGE7_RESILIENT_PIPELINE_DONE; echo $? > /app/persist/pipeline.exit ) >> /app/persist/pipeline.log 2>&1 & exec /app/.venv/bin/python -m http.server ${PORT:-8080} --directory /app/persist'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
