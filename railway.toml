[build]
builder = "RAILPACK"

[deploy]
startCommand = "bash -lc 'rm -rf external/UDED external/UDED-main && mkdir -p external && /app/.venv/bin/python -c \"import io,zipfile,requests,pathlib,shutil; p=pathlib.Path(\\\"external\\\"); z=zipfile.ZipFile(io.BytesIO(requests.get(\\\"https://github.com/xavysp/UDED/archive/refs/heads/main.zip\\\",timeout=120).content)); z.extractall(p); shutil.move(str(p/\\\"UDED-main\\\"),str(p/\\\"UDED\\\"))\" && /app/.venv/bin/python synthetic_v2.py && /app/.venv/bin/python benchmark_measure_competition.py --skip-full-capacity && /app/.venv/bin/python benchmark_uded_fusion_fixed.py --uded-root external/UDED --thresholds 21 --max-side 256 --bootstrap 5000 && echo UDED_FUSION_FIXED_PIPELINE_DONE && /app/.venv/bin/python -m http.server ${PORT:-8080} --directory benchmark_outputs'"
restartPolicyType = "NEVER"
