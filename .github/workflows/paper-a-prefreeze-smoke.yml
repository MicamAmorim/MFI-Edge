name: Paper A prefreeze smoke checks
on:
  push:
    branches:
      - experiment/paper-a-conditional-confirmation
  workflow_dispatch:
jobs:
  safe-draft-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile overnight runner and safe packager
        run: |
          python -m py_compile scripts/paper_a_overnight_agent.py scripts/package_paper_a_repro.py scripts/run_paper_a_prefreeze_one_shot.py
      - name: Controller synthetic safety tests
        run: python tests/test_paper_a_overnight_agent.py
      - name: Offline one-shot synthetic checks
        run: python tests/test_paper_a_prefreeze_one_shot.py

      - name: Install synthetic-validation scientific dependencies
        run: python -m pip install numpy scipy scikit-image
      - name: Test scientific freeze and inference gates (synthetic only)
        run: |
          python tests/test_paper_a_freeze_guard.py
          python tests/test_analyze_paper_a_confirmed.py
          python tests/test_finish_paper_a.py
          python tests/test_fit_paper_a_development_uded14.py
      - name: Pre-GT H1-H2 predictor and P1 smoke tests (synthetic only)
        run: |
          python -m py_compile src/paper_a_h1h2_inference_core.py scripts/preflight_paper_a_h1h2_core.py tests/test_paper_a_h1h2_inference_core.py
          python tests/test_paper_a_h1h2_inference_core.py
          python scripts/preflight_paper_a_h1h2_core.py
          python tests/test_paper_a_paired_f1_contract.py
      - name: Synthetic-only Stage23 pre-GT image adapter tests
        run: |
          python -m py_compile src/paper_a_prefreeze_map_adapter.py tests/test_paper_a_prefreeze_map_adapter.py scripts/preflight_paper_a_prefreeze_map_adapter.py
          python tests/test_paper_a_prefreeze_map_adapter.py
          python scripts/preflight_paper_a_prefreeze_map_adapter.py
          python scripts/preflight_paper_a_prefreeze_map_adapter.py --real-stage23
      - name: MultiCue filename-only contract tests (synthetic, no dataset or GT)
        run: |
          python -m py_compile scripts/check_paper_a_multicue_gt_task_names.py
          python tests/test_paper_a_multicue_gt_task_names.py
      - name: One-command runner pure safety checks
        run: python tests/test_continuar_paper_a.py
      - name: Check post-freeze executor on synthetic masks only
        run: |
          python -m py_compile scripts/execute_paper_a_frozen_cohort.py
          python tests/test_execute_paper_a_frozen_cohort.py
      - name: Scientific review dossier safety tests (metadata/synthetic only)
        run: |
          python -m py_compile scripts/revisar_paper_a_pre_freeze.py
          python tests/test_revisar_paper_a_pre_freeze.py
      - name: Strict text-only prefreeze review bundle tests
        run: |
          python -m py_compile scripts/export_paper_a_review_bundle.py
          python tests/test_export_paper_a_review_bundle.py
      - name: Build package without scientific data
        run: python scripts/package_paper_a_repro.py --outdir dist
      - name: Preserve baseline preconfirmatory manuscript and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: paper-a-preconfirmatory-manuscript-and-repro
          path: |
            dist/*.zip
            dist/*.sha256.txt
          if-no-files-found: error
          retention-days: 14
